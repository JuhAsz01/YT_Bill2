<!DOCTYPE html>
<html>

<head>

<title>YouTube Premium</title>

<style>

body{
font-family: Arial;
background:#F7F5EF;
padding:40px;
}

h1{
text-align:center;
color: #000;
font-weight: bold;
}

.container{
max-width:400px;
margin:auto;
}

.card{

background:rgba(171, 82, 80, 0.2);
color: #141413;
padding:20px;
margin:15px 0;
border-radius:10px;
box-shadow:0 4px 10px #0000001a;

display:flex;
justify-content:space-between;
font-size:25px;

}

.amount{
font-weight:bold;
color:#ae2432;
}

</style>

</head>

<body>

<h1>Youtube Premium</h1>

<div class="container" id="list"></div>

<script>

fetch("/debts")
.then(r=>r.json())
.then(data=>{

const list=document.getElementById("list");

data.forEach(d=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<span>${d.name}</span>
<span class="amount">${d.amount} Ft</span>
`;

list.appendChild(card);

});

});

</script>

</body>
</html>
